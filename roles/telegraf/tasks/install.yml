---

- name: user and group handling
  when:
    - not running_in_check_mode
    - telegraf_system_user != "root" or telegraf_system_group != "root"
  block:
    - name: create telegraf group
      ansible.builtin.group:
        name: "{{ telegraf_system_group }}"
        state: present
        system: true
      when:
        - telegraf_system_group != "root"

    - name: create telegraf user
      ansible.builtin.user:
        name: "{{ telegraf_system_user }}"
        groups: "{{ telegraf_system_group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: /nonexistent
      when:
        - telegraf_system_user != "root"

- name: create install directory
  when:
    - not running_in_check_mode
  ansible.builtin.file:
    path: "{{ telegraf_install_path }}"
    state: directory
    owner: "{{ telegraf_system_user }}"
    group: "{{ telegraf_system_group }}"
    mode: "0755"

- name: deploy and activate telegraf version {{ telegraf_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ telegraf_local_tmp_directory }}/usr/bin"
    install_dir: "{{ telegraf_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if telegraf_direct_download else 'false') | bool }}"
    owner: "{{ telegraf_system_user }}"
    group: "{{ telegraf_system_group }}"
    mode: "0755"
    items:
      - name: telegraf
        # capability: "cap_net_raw+ep"
  notify:
    - restart telegraf

- name: merge telegraf configuration between defaults and custom
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    telegraf_service: "{{ telegraf_defaults_service | combine(telegraf_service, recursive=True) }}"

- name: systemd
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "systemd"
  block:
    - name: create telegraf run configuration
      ansible.builtin.template:
        src: "telegraf.j2"
        dest: "{{ telegraf_defaults_directory }}/telegraf"
        force: true
        owner: root
        group: "{{ telegraf_system_group }}"
        mode: "0640"
      notify:
        - restart telegraf

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/telegraf.service.j2"
        dest: "{{ systemd_lib_directory }}/telegraf.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon-reload
        - restart telegraf

- name: openrc
  when:
    - not running_in_check_mode
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/telegraf.j2"
        dest: "/etc/conf.d/telegraf"
        owner: root
        group: root
        mode: "0644"
      notify:
        - restart telegraf

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/telegraf.j2"
        dest: "/etc/init.d/telegraf"
        owner: root
        group: root
        mode: "0750"
      notify:
        - restart telegraf

- name: create custom fact file
  bodsch.core.facts:
    name: telegraf
    facts:
      version: "{{ telegraf_version }}"

...
