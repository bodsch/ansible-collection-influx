---

# see: https://docs.influxdata.com/influxdb/v2/reference/release-notes/influxdb/
influxdb2_version: "2.4.0"

# see: https://docs.influxdata.com/influxdb/v2/reference/release-notes/influx-cli/
influxdb2_cli_version: "{{ influxdb2_version }}"

influxdb2_scm:
  use_tags: false
  without_beta: false
  version_filter:
    - ".*test*"
    - ".*preview"
    - ".*beta"
    - ".*rc"

influxdb2_release: {}
  # download_url: ""
  # api_url: ""
  # files:
  #   influxdb: ""
  #   influx_client: ""
  # binaries:
  #   influxd: ""
  #   influx: ""

influxdb2_system_user: influxdb
influxdb2_system_group: influxdb
influxdb2_config_dir: /etc/influxdb2
influxdb2_storage_dir: /var/lib/influxdb2

influxdb2_direct_download: false

# User-facing override for the influxd configuration. Merged (recursive) over
# influxdb2_defaults_service (vars/main.yml) in tasks/prepare.yml and rendered into the
# influxd config file (templates/etc/influxdb/config.yml.j2). See that catalogue for every
# available option, its influxd config key and minimum version.
influxdb2_service: {}

influxdb2_primary:
  organization: example-org
  bucket: example-bucket
  username: example-user
  password: LA9NMTb6WZ285zPGPgyUJEucuJUjr6W7
  token: example-token

influxdb2_organizations: {}

influxdb2_users: {}

influxdb2_buckets: {}

...
