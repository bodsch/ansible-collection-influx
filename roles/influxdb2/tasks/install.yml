---

- name: user and group handling
  when:
    - influxdb_system_user != "root"
  block:
    - name: create influxdb group
      ansible.builtin.group:
        name: "{{ influxdb_system_group }}"
        state: present
        system: true

    - name: create influxdb user
      ansible.builtin.user:
        name: "{{ influxdb_system_user }}"
        groups: "{{ influxdb_system_group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: "{{ influxdb_storage_dir }}"

- name: create install directory trees
  bodsch.core.directories:
    owner: "{{ influxdb_system_user }}"
    group: "{{ influxdb_system_group }}"
    mode: "0755"
    paths:
      - path: "{{ influxdb_install_paths.influxd }}"
      - path: "{{ influxdb_install_paths.influx }}"
      - path: "{{ influxdb_storage_dir }}"
      - path: "{{ influxdb_storage_dir }}/meta"
      - path: "{{ influxdb_storage_dir }}/data"
      - path: "{{ influxdb_storage_dir }}/wal"

