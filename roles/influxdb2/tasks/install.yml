---

- name: user and group handling
  when:
    - influxdb2_system_user != "root"
  block:
    - name: create influxdb group
      ansible.builtin.group:
        name: "{{ influxdb2_system_group }}"
        state: present
        system: true

    - name: create influxdb user
      ansible.builtin.user:
        name: "{{ influxdb2_system_user }}"
        groups: "{{ influxdb2_system_group }}"
        append: true
        shell: /usr/sbin/nologin
        system: true
        createhome: false
        home: "{{ influxdb2_storage_dir }}"

- name: create install directory trees
  bodsch.core.directories:
    owner: "{{ influxdb2_system_user }}"
    group: "{{ influxdb2_system_group }}"
    mode: "0755"
    paths:
      - path: "{{ influxdb2_install_paths.influxd }}"
      - path: "{{ influxdb2_install_paths.influx }}"
      - path: "{{ influxdb2_storage_dir }}"
      - path: "{{ influxdb2_storage_dir }}/meta"
      - path: "{{ influxdb2_storage_dir }}/data"
      - path: "{{ influxdb2_storage_dir }}/wal"

- name: deploy and activate influxd version {{ influxdb2_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ influxdb2_local_tmp_directory }}"
    install_dir: "{{ influxdb2_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if influxdb2_direct_download else 'false') | bool }}"
    owner: "{{ influxdb2_system_user }}"
    group: "{{ influxdb2_system_group }}"
    mode: "0755"
    items:
      - name: influxd
  notify:
    - restart influxdb2

- name: systemd
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  block:

    - name: create influxdb run configuration
      ansible.builtin.template:
        src: "default/influxdb2.j2"
        dest: "{{ influxdb2_defaults_directory }}/influxdb2"
        force: true
        owner: root
        group: "{{ influxdb2_system_group }}"
        mode: "0640"
      notify:
        - restart influxdb2

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/influxdb2.service.j2"
        dest: "{{ systemd_lib_directory }}/influxdb2.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - systemd daemon reload
        - restart influxdb2

- name: openrc
  when:
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/influxdb2.j2"
        dest: "/etc/conf.d/influxdb2"
        owner: root
        group: root
        mode: "0644"
      notify:
        - restart influxdb2

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/influxdb2.j2"
        dest: "/etc/init.d/influxdb2"
        owner: root
        group: root
        mode: "0750"

- name: create custom fact file
  bodsch.core.facts:
    name: influxdb
    facts:
      version:
        influxd: "{{ influxdb2_version }}"
        influx: "{{ influxdb2_cli_version }}"

...
