- name: deploy and activate influxd version {{ influxdb_version }}
  when:
    - not running_in_check_mode
  bodsch.core.deploy_and_activate:
    src_dir: "{{ influxdb_local_tmp_directory }}"
    install_dir: "{{ influxdb_install_path }}"
    link_dir: "/usr/bin"
    remote_src: "{{ ('true' if influxdb_direct_download else 'false') | bool }}"
    owner: "{{ influxdb_system_user }}"
    group: "{{ influxdb_system_group }}"
    mode: "0755"
    items:
      - name: influxd
  notify:
    - restart influxdb2

- name: systemd
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  block:

    - name: create influxdb run configuration
      ansible.builtin.template:
        src: "default/influxdb.j2"
        dest: "{{ influxdb_defaults_directory }}/influxdb"
        force: true
        owner: root
        group: "{{ influxdb_system_group }}"
        mode: "0640"
      notify:
        # - validate config
        - restart influxdb2

    - name: create systemd service unit
      ansible.builtin.template:
        src: "init/systemd/influxdb.service.j2"
        dest: "{{ systemd_lib_directory }}/influxdb.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - systemd daemon reload

- name: openrc
  when:
    - ansible_facts.service_mgr | lower == "openrc"
  block:
    - name: create openrc service configuration
      ansible.builtin.template:
        src: "init/openrc/conf.d/influxdb.j2"
        dest: "/etc/conf.d/influxdb"
        owner: root
        group: root
        mode: "0644"
      notify:
        - restart influxdb2

    - name: create openrc init configuration
      ansible.builtin.template:
        src: "init/openrc/init.d/influxdb.j2"
        dest: "/etc/init.d/influxdb"
        owner: root
        group: root
        mode: "0750"

- name: create custom fact file
  bodsch.core.facts:
    name: influxdb
    facts:
      version:
        influxd: "{{ influxdb_version }}"
        influx: "{{ influxdb_cli_version }}"

...
