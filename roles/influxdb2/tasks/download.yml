- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ influxdb2_delegate_to }}"
  run_once: "{{ 'false' if influxdb2_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ influxdb2_local_tmp_directory }}/influxd"
  register: stat_influxdb2_binary

- name: extract influxdb archiv
  when:
    - not running_in_check_mode
    - stat_influxdb2_binary.stat is defined
    - not stat_influxdb2_binary.stat.exists | default(false) | bool
  become: false
  delegate_to: "{{ influxdb2_delegate_to }}"
  run_once: "{{ 'false' if influxdb2_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ influxdb2_local_tmp_directory }}/{{ influx_downloads.download_artifact }}"
    dest: "{{ influxdb2_local_tmp_directory }}/"
    copy: false
    extra_opts:
      - --strip-components=1
